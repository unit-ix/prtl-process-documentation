# Cloudflare Pages Direct-Upload — GEGATED + OFF BY DEFAULT.
#
# Läuft NICHT, solange die Repo-Variable CF_DEPLOY_ENABLED nicht auf 'true' steht
# (Settings > Secrets and variables > Actions > Variables). Zusätzlich brauchen die
# Secrets CF_API_TOKEN + CLOUDFLARE_ACCOUNT_ID gesetzt zu sein, sonst schlägt der Deploy
# bewusst fehl. Bis dahin ist dieser Workflow dokumentiert, aber inert.
#
# Der localhost-first-Default (pnpm dev) + das lokale scripts/deploy-prototype.mjs bleiben
# der Interims-Pfad. Manueller git-connect (push-to-deploy) ist Dashboard-only, siehe docs/hosting.md.

name: deploy-prototype

on:
  workflow_dispatch: {}
  push:
    branches: [prototype]

permissions:
  contents: read

jobs:
  deploy:
    # Gate: nur wenn die Repo-Variable explizit aktiviert ist. Default = aus.
    if: ${{ vars.CF_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy to Cloudflare Pages (Direct Upload)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ github.event.repository.name }}
