# Die EINE Pipeline: verify + deploy als zwei Jobs in einer Datei, damit sie nicht auseinanderdriften.
name: CI

on:
    pull_request:
    push:
        branches: [main, dev, prototype]
    workflow_dispatch: {}

jobs:
    verify:
        runs-on: ubuntu-latest
        # CI läuft nur in abgeleiteten Kundenprojekten, nicht im Template-Repo selbst.
        if: github.repository != 'unit-ix/code-apps-template'
        steps:
            # submodules: recursive zieht das PRIVATE code-apps-context (.claude/). Der Default-GITHUB_TOKEN
            # hat KEINEN Lesezugriff auf andere private Repos → einen PAT/Deploy-Key mit Leserecht auf
            # unit-ix/code-apps-context als Repo-Secret hinterlegen und unten als `token:` setzen, sonst
            # schlägt der Submodul-Checkout fehl.
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            # Guard: in einem noch nicht materialisierten Repo (kein package.json/Lockfile) sauber
            # skippen statt an `--frozen-lockfile` zu sterben.
            - id: toolchain
              shell: bash
              run: |
                  if [[ -f package.json && -f pnpm-lock.yaml ]]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Toolchain noch nicht materialisiert (package.json/pnpm-lock.yaml fehlt) — verify übersprungen."
                  fi

            - if: steps.toolchain.outputs.ready == 'true'
              uses: pnpm/action-setup@v5
              with:
                  version: 10

            - if: steps.toolchain.outputs.ready == 'true'
              uses: actions/setup-node@v6
              with:
                  # 24 = aktuelle Node-LTS-Linie, konsistent mit .nvmrc (24) und package.json engines (>=24).
                  node-version: 24
                  cache: pnpm

            - if: steps.toolchain.outputs.ready == 'true'
              run: pnpm install --frozen-lockfile

            # Exakt derselbe Lauf wie lokal: pnpm verify = check:env && lint && knip && build
            # (build = tsc --noEmit && vite build). Keine separaten Steps, damit CI nie abweicht.
            - if: steps.toolchain.outputs.ready == 'true'
              run: pnpm verify

    # Cloudflare-Pages-Deploy. GEGATET + standardmäßig AUS: läuft erst mit gesetzter Repo-Variable
    # CLOUDFLARE_DEPLOY_ENABLED und vorhandenen Secrets. Bis dahin dokumentiert, aber inert.
    #
    # Nur die drei Umgebungs-Branches deployen (prototype/dev/main), NIE feature/* — Build-Minuten
    # sind ein reales Budget. Das Script ist host-aware: bei `frontend: swa` (Azure) oder
    # `powerapps` überspringt es dev/main sauber, prototype deployt immer. Siehe docs/hosting.md.
    deploy:
        runs-on: ubuntu-latest
        needs: verify
        if: contains(fromJSON('["refs/heads/prototype", "refs/heads/dev", "refs/heads/main"]'), github.ref) && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        # Zwei schnelle Pushes auf denselben Branch sollen nicht doppelt Build-Minuten verbrennen.
        concurrency:
            group: deploy-${{ github.ref }}
            cancel-in-progress: true
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v5
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            # Ruft bewusst DAS Script statt die Deploy-Logik zu duplizieren: sonst nimmt CI den
            # Repo-Namen und das Script .unitix/project.json als Slug-Quelle → zwei Pages-Projekte
            # mit zwei URLs. Das Script sanitized den Slug und legt das Projekt bei Bedarf an
            # (wrangler täte das nur interaktiv). --branch bestimmt Umgebung + Ziel-Projekt.
            - run: node scripts/deploy-cloudflare.mjs --branch=${{ github.ref_name }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
