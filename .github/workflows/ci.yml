# Die EINE Pipeline: verify + deploy als zwei Jobs in einer Datei, damit sie nicht auseinanderdriften.
name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch: {}

jobs:
    verify:
        runs-on: ubuntu-latest
        # CI läuft nur in abgeleiteten Kundenprojekten, nicht im Template-Repo selbst.
        if: github.repository != 'unit-ix/code-apps-template'
        steps:
            # submodules: recursive zieht das PRIVATE code-apps-context (.claude/). Der Default-GITHUB_TOKEN
            # hat KEINEN Lesezugriff auf andere private Repos → einen PAT/Deploy-Key mit Leserecht auf
            # unit-ix/code-apps-context als Repo-Secret hinterlegen und unten als `token:` setzen, sonst
            # schlägt der Submodul-Checkout fehl.
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            # Guard: in einem noch nicht materialisierten Repo (kein package.json/Lockfile) sauber
            # skippen statt an `--frozen-lockfile` zu sterben.
            - id: toolchain
              shell: bash
              run: |
                  if [[ -f package.json && -f pnpm-lock.yaml ]]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Toolchain noch nicht materialisiert (package.json/pnpm-lock.yaml fehlt) — verify übersprungen."
                  fi

            - if: steps.toolchain.outputs.ready == 'true'
              uses: pnpm/action-setup@v5
              with:
                  version: 10

            - if: steps.toolchain.outputs.ready == 'true'
              uses: actions/setup-node@v6
              with:
                  # 24 = aktuelle Node-LTS-Linie, konsistent mit .nvmrc (24) und package.json engines (>=24).
                  node-version: 24
                  cache: pnpm

            - if: steps.toolchain.outputs.ready == 'true'
              run: pnpm install --frozen-lockfile

            # Dieselben Stufen wie lokal in `pnpm verify`, hier aber als EINZELNE Steps: lokal zählt
            # der eine Befehl, in der CI die Ablesbarkeit — die rote Stufe steht dann im Balken
            # statt in einem Log. docs/pruefsystematik.md. Eine Abhängigkeits-Prüfung käme, falls
            # wir eine ergänzen, ans ENDE: vorne blockiert sie bei jeder neuen Meldung alles
            # dahinter, ohne dass jemand Code geändert hat.
            - name: Secrets im Bundle
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm check:env

            - name: CSP-Hosts
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm check:csp

            - name: Tests
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm test

            - name: Lint
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm lint

            - name: Knip
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm knip

            - name: Build
              if: steps.toolchain.outputs.ready == 'true'
              run: pnpm build

    # Cloudflare-Pages-Deploy des Mock-Prototyps. GEGATET + standardmäßig AUS: läuft erst mit
    # gesetzter Repo-Variable CLOUDFLARE_DEPLOY_ENABLED und vorhandenen Secrets. Bis dahin
    # dokumentiert, aber inert.
    #
    # Nur `main` deployt, NIE ein PR oder feature/* — Build-Minuten sind ein reales Budget. Das
    # Script ist host-aware: bei `platform: azure` oder `powerapps` steigt es sauber aus (exit 0),
    # dort deployt `pnpm deploy:dev` / `pnpm deploy:prod` von Hand. Siehe .claude/docs/patterns-azure.md.
    #
    # Der Azure-Deploy läuft bewusst NICHT in CI: er bräuchte Entra-OIDC-Federated-Credentials und
    # eine temporäre DB-Firewall-Regel für die wechselnde Runner-IP. Siehe .claude/docs/patterns-azure.md.
    deploy:
        runs-on: ubuntu-latest
        needs: verify
        if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        # Zwei schnelle Pushes auf denselben Branch sollen nicht doppelt Build-Minuten verbrennen.
        concurrency:
            group: deploy-${{ github.ref }}
            cancel-in-progress: true
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v5
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            # Ruft bewusst DAS Script statt die Deploy-Logik zu duplizieren: sonst nimmt CI den
            # Repo-Namen und das Script .unitix/project.json als Slug-Quelle → zwei Pages-Projekte
            # mit zwei URLs. Das Script sanitized den Slug und legt das Projekt bei Bedarf an
            # (wrangler täte das nur interaktiv).
            - run: node scripts/deploy-cloudflare.mjs
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
