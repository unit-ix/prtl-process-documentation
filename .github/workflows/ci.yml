# Die EINE Pipeline (konsolidiert 2026-07-17, Hosting-Stack-Review): verify + deploy als zwei Jobs
# in einer Datei statt zwei Workflows, die auseinanderdriften. Der frühere deploy-prototype.yml
# lief auf Node 20 / checkout@v4, während ci.yml auf Node 24 / checkout@v6 stand — genau die Art
# Drift, die Jakobs "wir müssen dann pnpm als Standard festlegen" adressiert.
name: CI

on:
    pull_request:
    push:
        branches: [main, dev, prototype]
    workflow_dispatch: {}

jobs:
    verify:
        runs-on: ubuntu-latest
        # CI läuft nur in abgeleiteten Kundenprojekten, nicht im Template-Repo selbst.
        if: github.repository != 'unit-ix/code-apps-template'
        steps:
            # submodules: recursive zieht das PRIVATE code-apps-context (.claude/). Der Default-GITHUB_TOKEN
            # hat KEINEN Lesezugriff auf andere private Repos → einen PAT/Deploy-Key mit Leserecht auf
            # unit-ix/code-apps-context als Repo-Secret hinterlegen und unten als `token:` setzen, sonst
            # schlägt der Submodul-Checkout fehl.
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            # Guard: vor dem Lovable-Import gibt es noch keine materialisierte Toolchain
            # (kein package.json/Lockfile). Dann sauber skippen statt an `--frozen-lockfile` zu sterben.
            - id: toolchain
              shell: bash
              run: |
                  if [[ -f package.json && -f pnpm-lock.yaml ]]; then
                      echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "ready=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::Toolchain noch nicht materialisiert (package.json/pnpm-lock.yaml fehlt) — verify übersprungen. Greift nach Lovable-Import + 'pnpm install'."
                  fi

            - if: steps.toolchain.outputs.ready == 'true'
              uses: pnpm/action-setup@v5
              with:
                  version: 10

            - if: steps.toolchain.outputs.ready == 'true'
              uses: actions/setup-node@v6
              with:
                  # 24 = aktuelle Node-LTS-Linie, konsistent mit .nvmrc (24) und package.json engines (>=24).
                  node-version: 24
                  cache: pnpm

            - if: steps.toolchain.outputs.ready == 'true'
              run: pnpm install --frozen-lockfile

            # Single Source of Truth: exakt derselbe Lauf wie lokal — pnpm verify = lint && knip && build
            # (build = tsc --noEmit && vite build, deckt den Typecheck mit ab). Keine separaten
            # Lint/Typecheck/Build-Steps mehr, damit CI nie von der lokalen Definition abweicht.
            - if: steps.toolchain.outputs.ready == 'true'
              run: pnpm verify

    # Cloudflare-Pages-Deploy. GEGATET + standardmäßig AUS — läuft erst, wenn Olli den Token
    # provisioniert hat und die Repo-Variable gesetzt ist. Bis dahin dokumentiert, aber inert.
    #
    # Deploy-Weg = GitHub Actions (entschieden 2026-07-17, Hosting-Stack-Review): der git-connect-/
    # Worker-Build-Weg bindet pro Cloudflare-Account nur EINEN GitHub-Account und ist damit aus einer
    # Agentur-Org nicht in Kunden-Cloudflare-Accounts deploybar. Dieser Weg läuft über Token + Account-ID
    # und bedient alle drei Ownership-Fälle. Siehe docs/hosting.md.
    #
    # Build-Minuten-Disziplin: nur die drei Umgebungs-Branches deployen (prototype/dev/main), NIE
    # feature/*. Drei Cloudflare-Projekte pro Kundenprojekt (2026-07-22): <slug>-prototype (eingefrorene
    # Kunden-Referenz), <slug>-dev (Testumgebung), <slug> (Produktion). Das Script ist target-aware —
    # bei target=dataverse überspringt es dev/main sauber (Power Platform), prototype deployt immer.
    deploy:
        runs-on: ubuntu-latest
        needs: verify
        if: contains(fromJSON('["refs/heads/prototype", "refs/heads/dev", "refs/heads/main"]'), github.ref) && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        # Zwei schnelle Pushes auf denselben Branch sollen nicht doppelt Build-Minuten verbrennen.
        concurrency:
            group: deploy-${{ github.ref }}
            cancel-in-progress: true
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
                  # token: ${{ secrets.SUBMODULE_TOKEN }}

            - uses: pnpm/action-setup@v5
              with:
                  version: 10

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile
            - run: pnpm build

            # Ruft bewusst DAS Script statt die Deploy-Logik zu duplizieren (Review Jakob, A3):
            # sonst nimmt CI den Repo-Namen und das Script .unitix/project.json als Slug-Quelle →
            # zwei Pages-Projekte mit zwei URLs. Das Script sanitized den Slug und legt das Projekt
            # bei Bedarf an (wrangler täte das sonst nur interaktiv → erster CI-Deploy failt).
            # --branch bestimmt Umgebung + Ziel-Projekt; wrangler liest beide Env-Vars nativ.
            - run: node scripts/deploy.mjs --branch=${{ github.ref_name }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
