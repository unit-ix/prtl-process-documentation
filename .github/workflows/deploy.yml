name: Deploy

# Cloudflare-Workers-Deploy (Static Assets) via GitHub Actions.
# Portiert aus unit-ix/3energy-vertragsmanagement — dort produktiv im Einsatz.
# Workers mit Static Assets ist Cloudflares Nachfolger des Pages-Modells:
# gleiches Direct-Upload-Prinzip, aber ein Produkt statt zwei.
#
#   main    -> Produktion  (Worker: <projekt-slug>)
#   develop -> Test        (Worker: test-<projekt-slug>)
#   PRs     -> Preview-Version des TEST-Workers (versions upload)
#
# Warum GitHub Actions statt Cloudflare git-connect/Workers Builds: die
# Cloudflare-GitHub-App bindet pro Cloudflare-Account nur EINEN GitHub-Account —
# aus der Agentur-Org heraus ist das nicht in Kunden-Cloudflare-Accounts
# deploybar. Token + Account-ID funktionieren in allen Ownership-Konstellationen.
#
# GEGATET + standardmäßig AUS: läuft erst, wenn die Repo-Variable
# CLOUDFLARE_DEPLOY_ENABLED == 'true' gesetzt ist (Settings -> Secrets and
# variables -> Actions -> Variables). Die Secrets CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID werden dabei NICHT mitgeprüft — fehlen sie, schlägt
# der Deploy-Step laut fehl (gewollt: Fehlkonfiguration soll sichtbar sein).
# Token-Vorlage: "Edit Cloudflare Workers", auf genau EINEN Account beschränkt.
#
# Erstinbetriebnahme (nach Lovable-Import):
#   1. wrangler.jsonc -> <projekt-slug> ersetzen (solange der Platzhalter
#      drinsteht, bricht der Deploy mit klarer wrangler-Fehlermeldung ab).
#   2. Variable + Secrets setzen.
#   3. ZUERST develop deployen — das legt den Test-Worker an, auf dem die
#      PR-Previews (versions upload) aufsetzen. Danach main.

on:
    # Manueller Auslöser: einen Deploy ohne neuen Commit wiederholen (z. B.
    # nach geänderten Secrets/Variablen oder einem ausgefallenen Lauf).
    # Dispatch von einem Feature-Branch erzeugt eine Preview auf dem Test-Worker.
    workflow_dispatch:
    push:
        branches: [main, develop]
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - ".gitignore"
            - ".editorconfig"
            - "supabase/**" # DB-Migrationen deployt ein eigener Workflow, nicht dieser
    pull_request:
        types: [opened, ready_for_review, synchronize, reopened]
        paths-ignore:
            - "**/*.md"
            - "docs/**"
            - ".gitignore"
            - ".editorconfig"
            - "supabase/**"

# Zwei schnelle Pushes auf denselben Branch/PR verbrennen keine doppelten
# Build-Minuten — der überholte Lauf wird abgebrochen.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest # NIE Windows/macOS (2x/10x Minuten-Multiplikator)
        timeout-minutes: 10
        permissions:
            contents: read
        # Läuft nur in abgeleiteten Kundenprojekten, nur wenn explizit aktiviert,
        # nie für Draft-PRs und nie für Fork-PRs (Secrets fehlen im Fork-Kontext).
        if: github.repository != 'unit-ix/code-apps-template' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
        steps:
            # Bewusst OHNE submodules: recursive — der Build braucht .claude/
            # nicht, und der Default-GITHUB_TOKEN kann das private Submodul
            # ohnehin nicht lesen (vgl. Kommentar in ci.yml).
            - uses: actions/checkout@v6

            # Fail-loud statt kryptischem --frozen-lockfile-Abbruch, falls die
            # Deploy-Variable VOR dem Lovable-Import aktiviert wurde.
            - name: Toolchain-Guard
              shell: bash
              run: |
                  if [[ ! -f package.json || ! -f pnpm-lock.yaml ]]; then
                      echo "::error::Toolchain noch nicht materialisiert (package.json/pnpm-lock.yaml fehlt). CLOUDFLARE_DEPLOY_ENABLED erst nach Lovable-Import + 'pnpm install' setzen."
                      exit 1
                  fi

            # Zielumgebung aus Branch/Event ableiten: wrangler-Kommando + Tier.
            # Die Worker-Namen stehen in wrangler.jsonc (env.production/env.test).
            - name: Zielumgebung bestimmen
              id: target
              shell: bash
              run: |
                  if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
                      echo "tier=production" >> "$GITHUB_OUTPUT"
                      echo "wrangler_command=deploy --env production" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
                      echo "tier=test" >> "$GITHUB_OUTPUT"
                      echo "wrangler_command=deploy --env test" >> "$GITHUB_OUTPUT"
                  else
                      echo "tier=preview" >> "$GITHUB_OUTPUT"
                      echo "wrangler_command=versions upload --env test" >> "$GITHUB_OUTPUT"
                  fi

            # KEIN hartes `version:` — action-setup liest das packageManager-Feld
            # der package.json (Single Source of Truth). Ein Pin an dieser Stelle
            # bricht hart, sobald packageManager auf eine Patch-Version gebumpt
            # wird ("Multiple versions of pnpm specified").
            - uses: pnpm/action-setup@v5

            - uses: actions/setup-node@v6
              with:
                  # 24 = aktuelle Node-LTS-Linie, konsistent mit .nvmrc und engines.
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Qualitäts-Gate + Build in einem: pnpm verify = exakt derselbe Lauf
            # wie lokal (Single Source of Truth, wie ci.yml) — ein kaputter Stand
            # wird nie deployt. `verify` enthält den Build und erzeugt dist/.
            # Führt das Projekt Tests ein, gehören sie in die verify-Kette.
            #
            # Braucht das Projekt Build-Zeit-Variablen (VITE_*), gehören sie als
            # `env:` an DIESEN Step — Vite backt sie beim Build ins Bundle.
            # ACHTUNG: Fehlen sie, wird trotzdem "grün" deployt, nur ohne
            # Backend-Anbindung. Beispiel Supabase (Zwei-Schema-Modell wie
            # 3energy: production -> public, test/preview -> test):
            #     env:
            #         VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
            #         VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
            #         VITE_SUPABASE_SCHEMA: ${{ steps.target.outputs.tier == 'production' && 'public' || 'test' }}
            - run: pnpm verify

            # wranglerVersion ist Pflicht: ohne den Input (und ohne lokale
            # wrangler-devDependency) installiert wrangler-action@v3 sein
            # einkompiliertes Default-wrangler 3.90.0 — und das liest
            # wrangler.jsonc noch nicht (JSON-Config ist erst ab 3.91 Standard).
            # Bewusst exakt gepinnt statt @latest: ein wrangler-Breaking-Release
            # soll nicht alle Kundenrepos gleichzeitig brechen.
            - name: Deploy nach Cloudflare Workers (${{ steps.target.outputs.tier }})
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4.113.0"
                  command: ${{ steps.target.outputs.wrangler_command }}
